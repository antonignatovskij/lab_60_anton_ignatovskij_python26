{% extends "base.html" %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-5 mb-7">
    <h1 class="h3 mb-0">Список категорий</h1>
</div>

<div class="row g-7">
    {% for category in categories %}
    <div class="">
        <article class="card h-100 border-0 rounded-5 shadow-sm">
            <div class="card-body">
                <h5 class="h5 text-break">{{ category.name }}</h5>
                <p class="fg-secondary mb-0">{{ category.description }}</p>
            </div>
            <div class="p-5 mt-auto">
                <div class="d-flex flex-wrap gap-3">
                    <a class="btn-sm btn-outline theme-secondary" href="{% url 'category_update' category.pk %}">Редактировать</a>
                    <a class="btn-sm btn-outline theme-danger" href="{% url 'category_delete' category.pk %}">Удалить</a>
                    <a href="{% url 'product_category_filter' category.name %}" class="btn-sm btn-solid theme-primary">Товары в этой категории</a>
                </div>
            </div>
        </article>
    </div>
    {% empty %}
    <p class="fg-secondary py-12 text-center">Пока нет категорий. Добавьте первую!</p>
    {% endfor %}
</div>
{% endblock %}
