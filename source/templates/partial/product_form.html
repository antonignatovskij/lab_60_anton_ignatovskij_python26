<form action="{% if action %}{% url action %}{% endif %}" id="product-form" method="POST">

    {% csrf_token %}

    {% for error in form.non_field_errors %}
    <p class="form-error">{{ error }}</p>
    {% endfor %}

    {% for field in form %}
    <p><label class="fg-secondary" for="{{ field.id_for_label }}">{{ field.label }}</label></p>
    {% for error in field.errors %}
    <p class="form-error fg-danger">{{ error }}</p>
    {% endfor %}
    <p class="">{{ field }}</p>
    {% endfor %}

</form>
