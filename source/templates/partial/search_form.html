<form method="get" class="card border-0 shadow-sm p-5 mb-7" role="search">
    <label for="{{ search_form.search.id_for_label }}" class="form-label">{{ search_form.search.label }}</label>
    <div class="input-group">
        {{ search_form.search }}
        <button type="submit" class="btn-solid theme-danger input-group-btn">Найти</button>
        <a href="{% url 'product_list' %}" class="btn-outline theme-secondary input-group-btn">Сбросить</a>
    </div>
</form>
